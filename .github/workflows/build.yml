name: SlideNX Reborn NRO build

on:
  push:
    branches:
      - main
      - master
      - "rebuild/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nro:
    name: Build foreground NRO
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compile SlideNX
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PATH="$DEVKITPRO/tools/bin:$DEVKITPRO/devkitA64/bin:$PATH"
          make clean
          make -j2
          test -s slidenx.nro
          file slidenx.nro || true
          sha256sum slidenx.nro

      - name: Upload NRO and instructions
        uses: actions/upload-artifact@v4
        with:
          name: SlideNX-Reborn-NRO
          path: |
            slidenx.nro
            README.md
          if-no-files-found: error
          retention-days: 14

      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SlideNX-Reborn-build-diagnostics
          path: |
            build/
            slidenx.elf
            slidenx.map
          if-no-files-found: ignore
          retention-days: 7
